[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-report"
version = "1.0.0"
description = "Generuje statyczny, interaktywny raport HTML (Assembly + Traceability) z plików Gerber, BOM i pick-and-place."
requires-python = ">=3.9"
readme = "README.md"
dependencies = ["gerbonara>=1.5.0"]

[project.scripts]
pcb-report = "pcb_report.cli:main"

[tool.setuptools]
packages = ["pcb_report"]

[tool.setuptools.package-data]
pcb_report = ["assets/*"]
